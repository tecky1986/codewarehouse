name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install backend and packager dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Assemble static assets (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path backend/static) { Remove-Item backend/static -Recurse -Force }
          Copy-Item frontend/dist backend/static -Recurse

      - name: Assemble static assets (Linux)
        if: runner.os == 'Linux'
        run: |
          rm -rf backend/static
          cp -r frontend/dist backend/static

      - name: Package Windows archive
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          python -m PyInstaller container_packing.spec --clean -y
          Compress-Archive -Path dist/container_packing -DestinationPath container-packing-windows-x64.zip

      - name: Package Linux archive
        if: matrix.platform == 'linux-x64'
        run: |
          python -m PyInstaller container_packing.spec --clean -y
          zip -qr container-packing-linux-x64.zip dist/container_packing

      - name: Upload platform archive
        uses: actions/upload-artifact@v4
        with:
          name: container-packing-${{ matrix.platform }}
          path: container-packing-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@v4
        with:
          pattern: container-packing-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Container Packing $GITHUB_REF_NAME" \
            --generate-notes